name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  caseflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/caseflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test

  dispatchgrid:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/dispatchgrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test

  relateai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/relateai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test

  portfolio-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portfolio-site/package-lock.json
      - run: npm ci
      - run: npm run build
