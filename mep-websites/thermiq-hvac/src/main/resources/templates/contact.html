<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Contact us</title>
    <meta name="description" content="Questions, business contracts or feedback — message Thermiq HVAC Services.">
</head>
<body>
<main layout:fragment="content">

    <section class="page-hero">
        <div class="container">
            <span class="kicker">Contact</span>
            <h1>We&rsquo;re here to help</h1>
            <p class="lead">For a repair or installation, <a th:href="@{/book}">booking online</a> is fastest. For anything else, send us a message.</p>
        </div>
    </section>

    <section class="section pt-0">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-7">
                    <form class="soft-card" th:action="@{/contact}" th:object="${message}" method="post" novalidate>
                        <div th:replace="~{common/fragments :: errorSummary}"></div>
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label class="form-label" for="fullName">Name</label>
                                <input class="form-control" type="text" th:field="*{fullName}" th:errorclass="is-invalid" autocomplete="name" required>
                                <div th:replace="~{common/fragments :: fieldError('fullName')}"></div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label" for="phone">Phone</label>
                                <input class="form-control" type="tel" th:field="*{phone}" th:errorclass="is-invalid" autocomplete="tel" placeholder="010 1234 5678" required>
                                <div th:replace="~{common/fragments :: fieldError('phone')}"></div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label" for="email">Email <span class="text-secondary small">(optional)</span></label>
                                <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid" autocomplete="email">
                                <div th:replace="~{common/fragments :: fieldError('email')}"></div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label" for="topic">Topic</label>
                                <select class="form-select" th:field="*{topic}" th:errorclass="is-invalid" required>
                                    <option value="">Choose…</option>
                                    <option th:each="t : ${topics}" th:value="${t}" th:text="${t.label}">Topic</option>
                                </select>
                                <div th:replace="~{common/fragments :: fieldError('topic')}"></div>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="message">Message</label>
                                <textarea class="form-control" rows="5" th:field="*{message}" th:errorclass="is-invalid" required></textarea>
                                <div th:replace="~{common/fragments :: fieldError('message')}"></div>
                            </div>
                        </div>
                        <div class="hp" aria-hidden="true">
                            <label for="website">Leave this field empty</label>
                            <input type="text" th:field="*{website}" tabindex="-1" autocomplete="off">
                        </div>
                        <button class="btn btn-pill btn-coral btn-lg mt-4" type="submit">Send message</button>
                    </form>
                </div>
                <aside class="col-lg-5">
                    <div class="soft-card">
                        <h2 class="h5">Reach us directly</h2>
                        <ul class="contact-list">
                            <li><svg class="ico"><use href="#i-phone"/></svg><a th:href="${company.phoneHref()}" th:text="${company.phone}">Phone</a></li>
                            <li><svg class="ico"><use href="#i-whatsapp"/></svg><a th:href="${company.whatsappHref()}" target="_blank" rel="noopener">WhatsApp</a></li>
                            <li><svg class="ico"><use href="#i-mail"/></svg><a th:href="${company.emailHref()}" th:text="${company.email}">Email</a></li>
                            <li><svg class="ico"><use href="#i-pin"/></svg><span th:text="${company.address}">Address</span></li>
                            <li><svg class="ico"><use href="#i-clock"/></svg><span th:text="${company.hours}">Hours</span></li>
                        </ul>
                    </div>
                </aside>
            </div>
        </div>
    </section>

</main>
</body>
</html>
