spring:
  application:
    name: axis-consultants
  messages:
    basename: mep-messages
  web:
    resources:
      cache:
        period: 7d
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**

server:
  port: ${PORT:8092}
  # Behind the portfolio gateway: SERVER_SERVLET_CONTEXT_PATH=/mep/axis
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie
  tomcat:
    use-relative-redirects: true
  error:
    whitelabel:
      enabled: false
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

company:
  name: Axis Engineering Consultants
  tagline: MEP design, BIM coordination & sustainability
  phone: "+20 2 2736 4400"
  email: studio@axis-engineering.example
  whatsapp: ""
  address: 7 El Sad El Aali Street, Dokki, Giza, Egypt
  hours: Sun–Thu · 09:00–18:00
  founded: 2013
  portfolio-url: ${PORTFOLIO_URL:https://amrsamy203.github.io}

# Indicative design fees in EGP. Override per environment, e.g. AXIS_FEES_MINIMUMFEE=150000.
axis:
  fees:
    rate-per-sqm:
      mechanical: 55
      electrical: 45
      public-health: 30
      fire: 25
      elv: 20
      sustainability: 15
    complexity-factor:
      standard: 1.0
      enhanced: 1.2
      critical: 1.5
    area-bands:
      - up-to: 10000
        factor: 1.0
      - up-to: 50000
        factor: 0.85
      - factor: 0.7
    bim-uplift: 0.18
    supervision-uplift: 0.30
    minimum-fee: 120000

---
spring:
  config:
    activate:
      on-profile: dev
  thymeleaf:
    cache: false
  web:
    resources:
      cache:
        period: 0
      chain:
        strategy:
          content:
            enabled: false
